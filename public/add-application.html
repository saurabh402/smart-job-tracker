<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Application - Smart Job Tracker</title>
    <meta name="description" content="Add a new job or internship application to your tracker.">
    <link rel="stylesheet" href="css/main.css">

    <style>
        nav {
            min-height: 72px;
            background: var(--bg-surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
            color: var(--primary-600);
            text-decoration: none;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
            font-size: 17px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
            padding: 8px 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--primary-600);
            background: var(--bg-hover);
        }

        .theme-toggle {
            background: var(--bg-muted);
            border: 1px solid var(--border-subtle);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 15px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto 60px;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin-bottom: 6px;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 15px;
        }

        .form-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 36px;
            box-shadow: var(--shadow-xl);
        }

        .form-section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 24px 0 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-section-title:first-of-type {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
            color: var(--text-secondary);
        }

        .required {
            color: #ef4444;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-page);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--border-focus);
            background: var(--bg-surface);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 14px;
            margin-top: 36px;
            padding-top: 24px;
            border-top: 1px solid var(--border-subtle);
        }

        .btn-cancel {
            text-decoration: none;
            padding: 12px 22px;
            background: var(--bg-muted);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-cancel:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .btn-submit {
            padding: 12px 28px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: auto;
            }
            .form-card {
                padding: 24px;
            }
            .form-actions {
                flex-direction: column;
            }
            .btn-cancel, .btn-submit {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="dashboard.html" class="brand">
            <div class="brand-icon">💼</div>
            Smart Job Tracker
        </a>

        <div class="nav-right">
            <button class="theme-toggle" id="darkToggleBtn" onclick="toggleDarkMode()" title="Toggle Dark/Light Mode">🌙</button>
            <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
        </div>
    </nav>

    <main class="container">
        <div class="page-header">
            <h1>Add New Application</h1>
            <p>Save company, job role, dates, URLs, and interview details in your pipeline.</p>
        </div>

        <div class="form-card">
            <form id="applicationForm">
                
                <div class="form-section-title">🏢 Job Overview</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="company">Company Name <span class="required">*</span></label>
                        <input type="text" id="company" placeholder="e.g. Google, Microsoft" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="role">Job Role / Title <span class="required">*</span></label>
                        <input type="text" id="role" placeholder="e.g. Frontend Engineer, Product Analyst" required>
                    </div>

                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" placeholder="e.g. Remote, Bangalore, New York">
                    </div>

                    <div class="form-group">
                        <label for="jobType">Job Type</label>
                        <select id="jobType">
                            <option value="Full Time">Full Time</option>
                            <option value="Part Time">Part Time</option>
                            <option value="Internship">Internship</option>
                            <option value="Contract">Contract</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="status">Current Status</label>
                        <select id="status">
                            <option value="Applied" selected>Applied</option>
                            <option value="Interview">Interview</option>
                            <option value="Selected">Selected</option>
                            <option value="Rejected">Rejected</option>
                            <option value="On Hold">On Hold</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="appliedDate">Application Date</label>
                        <input type="date" id="appliedDate">
                    </div>

                    <div class="form-group full-width">
                        <label for="jobUrl">Job Posting URL</label>
                        <input type="url" id="jobUrl" placeholder="https://careers.google.com/jobs/...">
                    </div>

                    <div class="form-group full-width">
                        <label for="notes">General Notes</label>
                        <textarea id="notes" placeholder="Salary range, referral info, resume version used, tech stack requirements..."></textarea>
                    </div>
                </div>

                <div class="form-section-title">🎤 Interview & Recruiter Details (Optional)</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="interviewDate">Interview Date</label>
                        <input type="date" id="interviewDate">
                    </div>

                    <div class="form-group">
                        <label for="interviewTime">Interview Time</label>
                        <input type="time" id="interviewTime">
                    </div>

                    <div class="form-group">
                        <label for="interviewRound">Interview Round</label>
                        <input type="text" id="interviewRound" placeholder="e.g. Technical Round 1, System Design, HR">
                    </div>

                    <div class="form-group">
                        <label for="interviewMode">Meeting Mode / Link</label>
                        <input type="text" id="interviewMode" placeholder="e.g. Google Meet, Zoom, On-site">
                    </div>

                    <div class="form-group">
                        <label for="interviewer">Interviewer / Recruiter Name</label>
                        <input type="text" id="interviewer" placeholder="e.g. Sarah Connor (Talent Lead)">
                    </div>

                    <div class="form-group full-width">
                        <label for="interviewNotes">Interview Preparation / Debrief Notes</label>
                        <textarea id="interviewNotes" placeholder="Questions asked, topics to review, coding challenges discussed..."></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="dashboard.html" class="btn-cancel">Cancel</a>
                    <button type="submit" class="btn-submit" id="saveBtn">Save Application</button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        // Set today's date as default appliedDate
        document.getElementById("appliedDate").value = new Date().toISOString().split("T")[0];

        const form = document.getElementById("applicationForm");
        const saveBtn = document.getElementById("saveBtn");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const applicationData = {
                company: document.getElementById("company").value.trim(),
                role: document.getElementById("role").value.trim(),
                location: document.getElementById("location").value.trim(),
                jobType: document.getElementById("jobType").value,
                status: document.getElementById("status").value,
                appliedDate: document.getElementById("appliedDate").value,
                jobUrl: document.getElementById("jobUrl").value.trim(),
                notes: document.getElementById("notes").value.trim(),
                interviewDate: document.getElementById("interviewDate").value,
                interviewTime: document.getElementById("interviewTime").value,
                interviewRound: document.getElementById("interviewRound").value.trim(),
                interviewMode: document.getElementById("interviewMode").value.trim(),
                interviewer: document.getElementById("interviewer").value.trim(),
                interviewNotes: document.getElementById("interviewNotes").value.trim()
            };

            saveBtn.disabled = true;
            saveBtn.textContent = "Saving to Database...";

            try {
                await API.createApplication(applicationData);
                showToast("Application saved successfully!", "success");
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 700);
            } catch (err) {
                showToast(err.message || "Failed to save application.", "error");
                saveBtn.disabled = false;
                saveBtn.textContent = "Save Application";
            }
        });
    </script>
</body>
</html>
